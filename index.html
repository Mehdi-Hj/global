<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>شب یلدات مبارک یلدا</title>

<!-- فونت فارسی -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Vazirmatn', sans-serif;
    }

    body {
        height: 100vh;
        background: radial-gradient(circle at top, #3b0a2a, #0b0210);
        overflow: hidden;
        color: #fff;
    }

    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background: transparent;
        animation: twinkle 10s infinite linear;
    }

    @keyframes twinkle {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
    }

    .container {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }

    .card {
        background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
        border-radius: 25px;
        padding: 50px 40px;
        max-width: 600px;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 40px rgba(255,0,80,0.4);
        animation: fadeUp 2s ease forwards;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(60px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        font-size: 3.2em;
        color: #ff4d6d;
        margin-bottom: 20px;
        text-shadow: 0 0 15px rgba(255,77,109,0.8);
    }

    h2 {
        font-size: 1.7em;
        margin-bottom: 25px;
        color: #ffd166;
    }

    p {
        font-size: 1.15em;
        line-height: 2.2;
        color: #f1f1f1;
    }

    .heart {
        font-size: 2.5em;
        margin-top: 25px;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    /* دانه‌های انار */
    .pomegranate {
        position: absolute;
        top: -10px;
        color: #ff355e;
        font-size: 20px;
        animation: fall linear infinite;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }
</style>
</head>
<body>

<div class="stars"></div>

<div class="container">
    <div class="card">
        <h1>یلدا ❤️</h1>
        <h2>شب یلدات مبارک</h2>
        <p>
            در بلندترین شب سال،  
            آرزو می‌کنم دلت همیشه روشن‌تر از هزاران شمع،  
            لبخندت گرم‌تر از آغوش انار،  
            و زندگی‌ات شیرین‌تر از هندوانه‌ی یلدا باشد.  
            <br><br>
            یلدا،  
            خودت زیباترین شب سالی 🌙✨
        </p>
        <div class="heart">🍉🍎</div>
        <p style="margin-top:25px; font-size:1.2em; color:#ffd166;">
    با کلی عشق و آرزوی قشنگ  
    <br>
    از طرف بچه‌های دزفول 💛
</p>

    </div>
</div>

<script>
    // ساخت دانه‌های انار
    for (let i = 0; i < 40; i++) {
        const p = document.createElement("div");
        p.classList.add("pomegranate");
        p.innerHTML = "●";
        p.style.left = Math.random() * 100 + "vw";
        p.style.animationDuration = (3 + Math.random() * 5) + "s";
        p.style.fontSize = (10 + Math.random() * 15) + "px";
        document.body.appendChild(p);
    }
</script>

</body>
</html>
