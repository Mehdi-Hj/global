<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Yalda</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Vazirmatn', sans-serif;
        background: radial-gradient(circle at top, #2b1055, #0a043c);
        height: 100vh;
        overflow: hidden;
        color: #fff;
    }

    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('https://i.imgur.com/5rG6FJk.png');
        animation: moveStars 60s linear infinite;
        opacity: 0.3;
    }

    @keyframes moveStars {
        from { background-position: 0 0; }
        to { background-position: 10000px 5000px; }
    }

    .container {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 50px 40px;
        max-width: 420px;
        box-shadow: 0 0 40px rgba(0,0,0,0.4);
        animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 15px;
        letter-spacing: 1px;
    }

    h2 {
        font-size: 20px;
        font-weight: 300;
        margin-bottom: 30px;
        opacity: 0.9;
    }

    p {
        font-size: 16px;
        line-height: 1.9;
        opacity: 0.85;
        margin-bottom: 30px;
    }

    .heart {
        font-size: 30px;
        animation: beat 1.5s infinite;
    }

    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }

    .signature {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div class="stars"></div>

<div class="container">
    <div class="card">
        <h1>یلدا ✨</h1>
        <h2>تولدت مبارک</h2>

        <p>
            بعضی آدم‌ها  
            بدون اینکه کاری بکنند  
            حالِ دنیا را بهتر می‌کنند.  
            <br><br>
            امیدوارم 21 سالگی  
            پر از آرامش، لبخند  
            و لحظه‌هایی باشد  
            که دلت بخواهد نگهشان داری.
        </p>

        <div class="heart">🤍</div>

        <div class="signature">
            از طرف کسی که  
            امروز به یادت بود
        </div>
    </div>
</div>

</body>
</html>
